name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Evidence drifts without anyone touching the repo: a source repository gets
    # renamed, a file moves, a fork is deleted. Check weekly, not only on push.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint
        run: npm run lint

      - name: Evidence integrity and drift
        run: node --test "tests/evidence.test.mjs"

      - name: AI grounding evaluation suite
        run: node --test "tests/engine.test.mjs"

      - name: MCP boundary tests
        run: node --test "tests/mcp.test.mjs"

      - name: MCP server self-test
        run: node mcp/server.mjs --selftest

      - name: Production build gate
        run: npm run build

      - name: Evidence link check
        # Authenticated so GitHub's unauthenticated rate limit cannot turn a
        # throttle into a false "evidence drift" failure.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/check-links.mjs

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
